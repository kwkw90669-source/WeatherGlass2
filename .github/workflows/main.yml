name: Build Weather Glass APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Locate Android project
    run: |
      if [ -f settings.gradle.kts ] && [ -f app/build.gradle.kts ]; then
        echo "PROJECT_DIR=." >> "$GITHUB_ENV"
      elif [ -f WeatherGlassAndroid/settings.gradle.kts ] && [ -f WeatherGlassAndroid/app/build.gradle.kts ]; then
        echo "PROJECT_DIR=WeatherGlassAndroid" >> "$GITHUB_ENV"
      else
        echo "Android project files not found."
        find . -maxdepth 4 -type f | head -200
        exit 1
      fi

  - name: Build debug APK
    run: gradle --no-daemon assembleDebug
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: WeatherGlass-debug-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
```
